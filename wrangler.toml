# Cloudflare Pages project for invicta.arcanedrift.net (ADXI: Invicta).
# Lives in the Arcane Drift Cloudflare account only (account ac6e9f7ba848384ed2b7db74449312da;
# deploy with CLOUDFLARE_ACCOUNT_ID set to it).
# Deploy: python Invicta/tools/export_static.py --out Invicta/site && npx wrangler pages deploy --branch main
name = "adxi-invicta"
pages_build_output_dir = "Invicta/site"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_REPO = "Jstrem2026/adxi-invicta"
# Discord helper bot (functions/api/discord.js). Not secret: Discord shows these on the app's
# General Information page and the server's Copy Server ID. The bot token is a GitHub secret only.
DISCORD_APP_ID = "1576282555412513040"
DISCORD_PUBLIC_KEY = "68205df6b6a9c0ab99b0e2fe825bbb71f5344e49878d3c0a91b7fd9383d5c73f"
DISCORD_GUILD_ID = "1576276524976574624"

[[kv_namespaces]]
binding = "LIMITS"
id = "56b981b0acd34c3fbc00d7f91b3f12af"

[[d1_databases]]
binding = "DB"
database_name = "adxi-invicta-db"
database_id = "0517f748-0a9f-4b5a-bb8c-873abc50428b"
migrations_dir = "migrations"
