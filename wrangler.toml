# Cloudflare Pages project for invicta.arcanedrift.net (ADXI: Invicta).
# Lives in the Arcane Drift Cloudflare account only.
# Deploy: python Invicta/tools/export_static.py --out Invicta/site && npx wrangler pages deploy --branch main
name = "adxi-invicta"
account_id = "ac6e9f7ba848384ed2b7db74449312da"
pages_build_output_dir = "Invicta/site"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_REPO = "Jstrem2026/adxi-invicta"

# KV (LIMITS) and D1 (DB) bindings are added once they exist in the Arcane Drift account.
