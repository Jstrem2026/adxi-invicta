name: Scan and publish the site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        run: python Invicta/atlas.py --scan
      - name: Report
        if: always()
        run: cat Invicta/reports/scan_report.md >> "$GITHUB_STEP_SUMMARY"
  publish:
    # Every merge to main rebuilds invicta.arcanedrift.net.
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Build the site
        run: python Invicta/tools/export_static.py --out Invicta/site
      - name: Apply database changes
        run: npx wrangler@4 d1 migrations apply adxi-invicta-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37be5a9dce6afdd0c076b2d457d18735
      - name: Publish to Cloudflare Pages
        run: npx wrangler@4 pages deploy --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37be5a9dce6afdd0c076b2d457d18735
