name: Deploy Avalon's gateway
# Deploys discord-gateway/ (the always-on Worker that hears Discord messages naming Avalon, Sentinel or a Governor)
# to the Arcane Drift Cloudflare account, and gives it the bot token from the DISCORD_BOT_TOKEN GitHub secret.
# The Cloudflare token needs "Workers Scripts: Edit" as well as Pages.
on:
  push:
    branches: [main]
    paths: ["discord-gateway/**", ".github/workflows/discord-gateway.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ac6e9f7ba848384ed2b7db74449312da
      BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy
        working-directory: discord-gateway
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$BOT_TOKEN" ]; then
            echo "Waiting for CLOUDFLARE_API_TOKEN or DISCORD_BOT_TOKEN, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npx --yes wrangler@4 deploy
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@4 secret put DISCORD_BOT_TOKEN
          echo "Deployed. It connects to Discord within a minute." >> "$GITHUB_STEP_SUMMARY"
